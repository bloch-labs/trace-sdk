[build-system]
requires = ["poetry-core==2.4.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bloch-trace"
version = "0.0.0"
description = "Python SDK for Bloch Trace."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Bloch Labs" }]
dependencies = []

[tool.poetry]
requires-poetry = "==2.4.3"
packages = [{ include = "bloch_trace", from = "src" }]
include = [{ path = "src/bloch_trace/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.requires-plugins]
poetry-plugin-export = "==1.10.0"

[tool.poetry.group.dev.dependencies]
mypy = "==2.3.1"
ruff = "==0.16.8"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = [".poetry"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
